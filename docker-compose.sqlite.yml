services:
  skillbox:
    build: .
    ports:
      - "8080:8080"
    environment:
      SKILLBOX_DATABASE_DRIVER: sqlite
      SKILLBOX_DATABASE_PATH: /data/skillbox.db
      SKILLBOX_SEED_DEMO: "true"
    volumes:
      - skillbox-sqlite:/data
    restart: unless-stopped

volumes:
  skillbox-sqlite:
