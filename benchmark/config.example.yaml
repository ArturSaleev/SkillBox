version: 1

server:
  # Keep the Benchmark UI local until authentication is implemented.
  address: "127.0.0.1:8091"

database:
  # Chat history and future benchmark results live in a separate SQLite database.
  path: "./benchmark/data/skillbox-benchmark.db"

providers:
  - id: openrouter
    name: OpenRouter
    type: openai_compatible
    enabled: false
    base_url: "https://openrouter.ai/api/v1"
    api_key: ""
    api_key_env: "OPENROUTER_API_KEY"
    default_model: "openrouter/free"
    request_timeout: "120s"

  - id: gemini
    name: Gemini API
    type: openai_compatible
    enabled: false
    base_url: "https://generativelanguage.googleapis.com/v1beta/openai/"
    api_key: ""
    api_key_env: "GEMINI_API_KEY"
    default_model: ""
    request_timeout: "120s"

  - id: local
    name: Local OpenAI-compatible model
    type: openai_compatible
    enabled: false
    base_url: "http://127.0.0.1:1234/v1"
    api_key: ""
    default_model: ""
    request_timeout: "120s"

mcp_servers:
  - id: skillbox_student
    name: SkillBox Student
    enabled: false
    transport: streamable_http
    url: "http://127.0.0.1:8081/mcp/benchmark"
    auth_header: ""
    auth_value: ""
    request_timeout: "30s"

  - id: skillbox_teacher
    name: SkillBox Teacher
    enabled: false
    transport: streamable_http
    url: "http://127.0.0.1:8081/mcp/benchmark/teacher"
    auth_header: ""
    auth_value: ""
    request_timeout: "30s"

runner:
  max_steps: 20
  parallel_runs: 2
