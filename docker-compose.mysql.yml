services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: skillbox
      MYSQL_USER: skillbox
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: root-password
    volumes:
      - skillbox-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uskillbox", "-ppassword"]
      interval: 5s
      timeout: 3s
      retries: 20

  skillbox:
    build: .
    ports:
      - "8080:8080"
    environment:
      SKILLBOX_DATABASE_DRIVER: mysql
      SKILLBOX_DATABASE_DSN: "skillbox:password@tcp(mysql:3306)/skillbox?parseTime=true"
      SKILLBOX_SEED_DEMO: "true"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

volumes:
  skillbox-mysql:
